<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>链动小铺兑换码购买</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --accent: #1677ff;
      --accent-dark: #0958d9;
      --ring: rgba(22, 119, 255, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 16%, rgba(22, 119, 255, 0.12), transparent 28%),
        radial-gradient(circle at 82% 72%, rgba(16, 185, 129, 0.10), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(100%, 520px);
      padding: 40px 24px;
      border: 1px solid rgba(31, 41, 55, 0.08);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(22px, 6vw, 34px);
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    p {
      margin: 0 auto 28px;
      max-width: 360px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 176px;
      padding: 0 24px;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    a:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(22, 119, 255, 0.24);
    }

    a:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>请前往链动小铺购买兑换码</h1>
    <p>点击下方按钮进入购买页面，完成兑换码购买。</p>
    <a href="https://wzyp.cn/shop/HNGFW0MA" target="_blank" rel="noopener">前往购买</a>
  </main>
</body>
</html>
